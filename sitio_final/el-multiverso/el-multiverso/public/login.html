<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilos.css"><title>Iniciar sesión | El Multiverso</title></head>
<body>
<header id="barra"></header>
<main class="centro">
  <form class="tarjeta login" id="formLogin" novalidate>
    <h1>Iniciar Sesión</h1>
    <div id="msg" class="alerta oculto" role="alert"></div>
    <div class="campo"><label for="id">IDUsuario / Cliente:</label><input id="id" name="id" inputmode="numeric" maxlength="4" autocomplete="username" autofocus></div>
    <div class="campo"><label for="password">Contraseña:</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
    <div class="pila">
      <button class="btn btn-azul btn-block" type="submit">Entrar</button>
      <a class="btn btn-verde btn-block" href="/registro.html">Registrar</a>
    </div>
  </form>
</main>
<script src="/js/app.js"></script>
<script>
iniciarBarra();
document.getElementById('formLogin').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const id = e.target.id.value.trim(), password = e.target.password.value;
  if (!id || !password) return mostrarAlerta(msg, 'Escribe tu ID de usuario y contraseña.');
  try { await api('/api/login', { method: 'POST', body: { id, password } }); location.href = '/'; }
  catch (err) { mostrarAlerta(msg, err.message); }
});
</script>
</body></html>
