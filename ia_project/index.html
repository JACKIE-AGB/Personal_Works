<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFE Intelligent Search</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
  <style>

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background-color: #131314;
      color: #e3e3e3;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      box-sizing: border-box;
      border-right: 1px solid #303134;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease, border 0.3s ease;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }

    .sidebar-header {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      padding-left: 8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .cfe-logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: #1e1e1f;
      color: #e3e3e3;
      border: none;
      padding: 12px 16px;
      border-radius: 24px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .new-chat-btn:hover { background: #2b2b2c; }

    .sidebar-menu-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #c4c7c5;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .sidebar-menu-item:hover {
      background: #1e1e1f;
      color: #ffffff;
    }

    .sidebar-section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #7c7f82;
      margin: 20px 0 10px 8px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .history-card {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-card:hover,
    .history-card.active { background: #1e1e1f; }

    .history-card-title {
      font-size: 14px;
      color: #e3e3e3;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-card-subtext {
      font-size: 11px;
      color: #80868b;
      padding-left: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
    }
    .history-card-subtext:hover {
      color: #1a73e8;
      text-decoration: underline;
    }

    .conv-actions-btn {
      background: none;
      border: none;
      color: #80868b;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }
    .conv-actions-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ff4d4d;
    }

    /* ═══════════════════════════════════════════════
       CONTENEDOR PRINCIPAL
    ═══════════════════════════════════════════════ */
    .main-app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      position: relative;
      min-width: 0;
    }

    /* ═══════════════════════════════════════════════
       BOTÓN HAMBURGUESA (contraer / expandir sidebar)
    ═══════════════════════════════════════════════ */
    .hamburger-btn {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 18px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .hamburger-btn:hover { background: rgba(60,64,67,.08); }

    /* ═══════════════════════════════════════════════
       HERO — CARRUSEL DE IMÁGENES DE LA CENTRAL
    ═══════════════════════════════════════════════ */
    .hero-carousel-section {
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #ebebeb;
      flex-shrink: 0;
    }

    .hero-slides-wrapper {
      position: absolute;
      inset: 0;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #1a1a1a;
      opacity: 0;
      transform: translateX(100%);
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity  0.85s ease;
    }
    .hero-slide.active {
      opacity: 1;
      transform: translateX(0);
    }
    .hero-slide.exiting {
      opacity: 0;
      transform: translateX(-100%);
    }

    .hero-placeholder-text {
      position: absolute;
      bottom: 24px;
      left: 30px;
      top: auto;
      transform: none;
      font-size: 22px;
      font-weight: 600;
      color: rgba(255,255,255,0.92);
      letter-spacing: 1.5px;
      pointer-events: none;
      user-select: none;
      font-family: 'Google Sans', Arial, sans-serif;
      z-index: 4;
      text-shadow: 0 1px 6px rgba(0,0,0,0.65);
      white-space: nowrap;
    }

    .hero-indicators {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 3;
    }
    .hero-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .hero-dot.active {
      background: rgba(255,255,255,0.95);
      transform: scale(1.35);
    }

    /* ═══════════════════════════════════════════════
       WRAPPER DEBAJO DEL HERO — search + blur apilados
    ═══════════════════════════════════════════════ */
    .below-hero-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      width: 100%;
    }

    /* ═══════════════════════════════════════════════
       ÁREA DE BÚSQUEDA (wrapper con padding)
    ═══════════════════════════════════════════════ */
    .search-area-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 28px 20px 10px;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }

    /* ═══════════════════════════════════════════════
       SECCIÓN BORROSA — ocupa TODO el espacio debajo del carrusel
    ═══════════════════════════════════════════════ */
    .blurred-mirror-section {
      position: absolute;
      inset: -30px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #c0c0c0;
      filter: blur(28px) brightness(0.58);
      z-index: 1;
      transition: background-image 0.85s ease;
    }

    /* ═══════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════ */
    .preview-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: #ffffff;
      width: 90%; height: 90%;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .modal-header {
      background: #f1f3f4;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dadce0;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: #202124;
      font-family: Arial, sans-serif;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #5f6368;
    }
    .close-modal:hover { color: #000000; }
    .modal-body { flex: 1; background: #525659; }

    /* ─── Grupo input Carpeta Rediseñado ─── */
    .folder-input-group {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 200px;
    }
    .folder-input-group .folder-path-input {
      flex: 1;
      border-radius: 8px !important;
    }
    
    .browse-folder-btn {
      background: #f0a500 !important;
      color: #ffffff !important;
      border: 1px solid #d49000 !important;
      border-radius: 8px !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .browse-folder-btn:hover {
      background: #d49000 !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .browse-folder-btn i {
      font-size: 14px;
    }

    /* Botón de Cancelación de Lectura Homogéneo */
    .cancel-process-btn {
      background: #d32f2f !important;
      color: #ffffff !important;
      border: 1px solid #b71c1c !important;
      border-radius: 8px !important;
      padding: 10px 16px !important;
      font-size: 14px !important;
      font-weight: 500 !important;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .cancel-process-btn:hover {
      background: #b71c1c !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .source-btn {
      background: #f1f3f4;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 5px 10px;
      margin: 4px 4px 0 0;
      cursor: pointer;
      font-size: 11px;
      color: #1a73e8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .source-btn:hover { background: #e8f0fe; }

    .panel-container {
      width: 100%;
      margin-bottom: 15px;
    }
    .results-action-area {
      padding: 10px 20px;
      background: #fafafa;
      border-bottom: 1px solid #eceff1;
    }

    /* ═══════════════════════════════════════════════
       BARRA FIJA PARA RESULTS VIEW
    ═══════════════════════════════════════════════ */
    #results-view {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      background: white;
    }

    .results-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-bottom: 1px solid var(--border, #dfe1e5);
      padding: 14px 20px 0;
    }

    /* Asegurar que el área de pregunta permanezca visible */
    .results-action-area {
      position: sticky;
      top: 110px;
      background: white;
      z-index: 99;
      border-bottom: 1px solid #eceff1;
    }

    .results-body {
      flex: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 24px 120px;
    }

    /* Almacén oculto para preservar los paneles antes del intercambio de pestañas */
    #panels-repository {
      display: none;
    }
  </style>
</head>
<body>

<div id="panels-repository">
  <div id="panelPdf" class="action-panel">
    <div class="action-row">
      <label class="upload-label" for="pdfFileInput">
        <i class="fas fa-upload"></i> Subir PDF
        <input type="file" id="pdfFileInput" accept=".pdf" style="display:none" onchange="onPdfSelected()" />
      </label>
      <span id="pdfFileName" class="filename-hint">Sin archivo</span>

      <select id="styleSelect" class="style-select">
        <option value="normal">Estilo: Normal</option>
        <option value="amable">Estilo: Amable</option>
        <option value="agresivo">Estilo: Directo</option>
      </select>

      <button class="action-btn primary-btn" onclick="processPdf()">
        <i class="fas fa-cogs"></i> Procesar PDF
      </button>
      <button id="cancelPdfBtn" class="action-btn cancel-process-btn" onclick="cancelPdfProcessing()" style="display:none;">
        <i class="fas fa-stop-circle"></i> Detener
      </button>
      <button class="action-btn ghost-btn" onclick="clearPdfChat()">
        <i class="fas fa-trash"></i> Limpiar
      </button>
    </div>
    <div id="pdfStatus" class="status-badge" style="display:none"></div>
    <div id="pdfActiveBadge" class="status-badge status-ok" style="display:none"></div>
  </div>

  <div id="panelFolder" class="action-panel" style="display:none">
    <div class="action-row">
      <div class="folder-input-group">
        <input type="text" id="folderPathInput" class="folder-path-input" placeholder="Ruta del directorio en el servidor..." />
      </div>
      <button class="action-btn browse-folder-btn" onclick="browseFolder()" title="Seleccionar carpeta desde el explorador de archivos">
        <i class="fas fa-folder-open"></i> Buscar
      </button>
      <button class="action-btn primary-btn" onclick="indexFolder()">
        <i class="fas fa-database"></i> Indexar Carpeta
      </button>
      <button id="cancelFolderBtn" class="action-btn cancel-process-btn" onclick="cancelFolderProcessing()" style="display:none;">
        <i class="fas fa-stop-circle"></i> Detener
      </button>
      <button class="action-btn ghost-btn" onclick="clearIndex()">
        <i class="fas fa-trash-alt"></i> Limpiar
      </button>
    </div>
    <div id="folderStatus" class="status-badge" style="display:none"></div>
  </div>
</div>

<div class="app-container">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img
        src="logo.png"
        alt="Logo CFE"
        class="cfe-logo-img"
        onerror="this.style.display='none'; document.getElementById('cfe-icon-fallback').style.display='inline-block';"
      />
      <i class="fas fa-layer-group" id="cfe-icon-fallback" style="color:#4285f4; display:none;"></i>
      <span>CFE Intelligent</span>
    </div>

    <button class="new-chat-btn" onclick="newConversation()">

    </button>

    <div class="sidebar-menu-item"><i class="fas fa-search"></i> Buscar conversaciones</div>
    <div class="sidebar-menu-item"><i class="fas fa-book-bookmark"></i> Biblioteca</div>

    <div class="sidebar-section-title">Recientes</div>
    <div class="history-list" id="sidebarHistoryList"></div>
  </aside>

  <div class="main-app-content">

    <header>
      <div class="header-left">
        <button class="hamburger-btn" onclick="toggleSidebar()" title="Contraer / expandir menú">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      <div class="header-links">
        <a href="#">Gmail</a>
        <a href="#">Imágenes</a>
        <div class="apps-icon"><i class="fas fa-th"></i></div>
        <div class="user-profile">M</div>
      </div>
    </header>

    <main id="main-view">

      <div class="hero-carousel-section" id="heroCarouselSection">
        <div class="hero-slides-wrapper" id="heroSlidesWrapper"></div>
        <div class="hero-placeholder-text" id="heroPlaceholder">Libro final</div>
        <div class="hero-indicators" id="heroIndicators"></div>
      </div>

      <div class="below-hero-wrapper">
        <div class="blurred-mirror-section" id="blurredMirror"></div>

        <div class="search-area-wrapper">
          <div class="search-container">
            <div class="search-box">
              <i class="fas fa-search search-icon"></i>
              <input

                class="search-input"
                id="searchInput"
                placeholder="Buscar o hacer una pregunta técnica..."

    <section id="results-view" style="display:none">

          <div class="logo-mini-cfe">
            <img
              src="logo.png"
              alt="CFE"

            />

          </div>
          <div class="search-box results-search-box">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"

              id="searchInputResults"
              placeholder="Buscar o hacer una pregunta..."
              onkeydown="if(event.key==='Enter') doSearch()"
            />

              <i class="fas fa-microphone microphone-icon"></i>

        <div class="results-tabs-bar">
          <button class="results-tab active" id="rtabPdf" onclick="switchTab('pdf')">

          <button class="results-tab" id="rtabFolder" onclick="switchTab('folder')">

        <div id="panelContainerResults" class="results-action-area">

      </div>

      <div class="results-body">
        <div id="aiOverview" class="ai-overview" style="display:none">

            <div class="ai-badge">

            </div>
            <div class="ai-sparkle">✦</div>
          </div>
          <div id="aiTyping" class="ai-typing" style="display:none">

    <div id="previewModal" class="preview-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Vista Previa de Documento Técnico</h3>
          <button class="close-modal" onclick="closePreview()">&times;</button>
        </div>

          <iframe id="previewIframe" src="" width="100%" height="100%" style="border:none;"></iframe>
        </div>
      </div>
    </div>

    <footer id="main-footer">
      <div class="footer-country">
        <span>México - Central Hidroeléctrica El Cajón</span>
      </div>
    </footer>

  </div>
</div>

<script>
const CAROUSEL_IMAGES = [
  "imagen1.jfif",   
  "imagen2.jfif",   
  "imagen3.jfif",   
  "imagen4.jfif",   
  "imagen5.jfif",   
];

const CAROUSEL_INTERVAL_MS = 180000;
const STORAGE_KEY = 'cfe_deleted_conversations';

let currentHeroSlide = 0;
let carouselTimer = null;

// Controladores de abortar peticiones (Lectura)
let pdfAbortController = null;
let folderAbortController = null;

function getDeletedConversations() {
  const stored = localStorage.getItem(STORAGE_KEY);
  return stored ? JSON.parse(stored) : [];
}

function addDeletedConversation(id) {
  const deleted = getDeletedConversations();
  if (!deleted.includes(id)) {
    deleted.push(id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(deleted));
  }
}

function isConversationDeleted(id) {
  return getDeletedConversations().includes(id);
}

// ── Limpieza total al cerrar el navegador/pestaña ──
function clearAllSessionsBeacon() {
  // sendBeacon garantiza que el POST llega aunque la página esté cerrándose
  try {
    navigator.sendBeacon(`${API}/clear_all_sessions/`);
  } catch(e) {
    // Fallback silencioso — el servidor limpiará en el próximo arranque
    console.warn("sendBeacon no disponible:", e);
  }
}

window.addEventListener('beforeunload', () => {
  // 1. Limpiar sidebar visualmente de forma inmediata
  const container = document.getElementById("sidebarHistoryList");
  if (container) container.innerHTML = "";
  conversationsCache = {};

  // 2. Borrar el registro local de conversaciones eliminadas
  localStorage.removeItem(STORAGE_KEY);

  // 3. Notificar al servidor para borrar índices y archivos subidos
  clearAllSessionsBeacon();
});

function initCarousel() {
  const wrapper    = document.getElementById('heroSlidesWrapper');
  const indicators = document.getElementById('heroIndicators');
  const placeholder = document.getElementById('heroPlaceholder');

  const hasRealImages = CAROUSEL_IMAGES.some(url => url.startsWith('http') || url.endsWith('.jfif') || url.endsWith('.png'));
  if (hasRealImages) {
    placeholder.style.display = 'none';
  }

  CAROUSEL_IMAGES.forEach((url, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.style.backgroundImage = `url('${url}')`;
    wrapper.appendChild(slide);

    const dot = document.createElement('div');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    indicators.appendChild(dot);
  });

  syncBlurred(CAROUSEL_IMAGES[0]);
  carouselTimer = setInterval(nextHeroSlide, CAROUSEL_INTERVAL_MS);
}

function goToSlide(index) {
  if (index === currentHeroSlide) return;

  const slides = document.querySelectorAll('.hero-slide');
  const dots   = document.querySelectorAll('.hero-dot');

  slides[currentHeroSlide].classList.remove('active');
  slides[currentHeroSlide].classList.add('exiting');

  const exiting = slides[currentHeroSlide];
  setTimeout(() => exiting.classList.remove('exiting'), 900);

  currentHeroSlide = index;
  slides[currentHeroSlide].classList.add('active');

  syncBlurred(CAROUSEL_IMAGES[currentHeroSlide]);
  dots.forEach((d, i) => d.classList.toggle('active', i === currentHeroSlide));
}

function nextHeroSlide() {
  goToSlide((currentHeroSlide + 1) % CAROUSEL_IMAGES.length);
}

function syncBlurred(imageUrl) {
  const blurred = document.getElementById('blurredMirror');
  if (blurred) blurred.style.backgroundImage = `url('${imageUrl}')`;
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
}

const API = "http://127.0.0.1:8001";
let currentTab = "pdf";

let activeConversationId = null;
let conversationsCache = {};

let pdfReady = false;
let folderReady = false;
let pdfFile = null;
let pdfLoadedName = "";

let chatMessages = {
  pdf: [],
  folder: []
};

function initTransparentHeader() {
    const header = document.querySelector('header');
    if (!header) return;
    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 10) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
}

window.addEventListener("DOMContentLoaded", () => {
  initCarousel();   
  switchTab("pdf");
  fetchConversations();
  initTransparentHeader();
});

async function fetchConversations() {
  try {
    const res = await fetch(`${API}/conversations/`);
    if (!res.ok) return;
    const allConversations = await res.json();
    
    const deletedIds = getDeletedConversations();
    conversationsCache = {};
    Object.entries(allConversations).forEach(([id, conv]) => {
      if (!deletedIds.includes(id)) {
        conversationsCache[id] = conv;
      }
    });
    
    renderSidebar();
  } catch (e) {
    console.error("Error cargando historial de barra lateral", e);
  }
}

function renderSidebar() {
  const container = document.getElementById("sidebarHistoryList");
  container.innerHTML = "";

  Object.values(conversationsCache).reverse().forEach(conv => {
    const isSelected = conv.id === activeConversationId ? "active" : "";
    const icon = conv.type === "pdf" ? "fa-file-pdf" : "fa-folder-open";

    const card = document.createElement("div");
    card.className = `history-card ${isSelected}`;
    card.id = `sidebar-card-${conv.id}`;
    card.onclick = () => loadConversation(conv.id);

    const cardHeader = document.createElement("div");
    cardHeader.style.display = "flex";
    cardHeader.style.justifyContent = "space-between";
    cardHeader.style.alignItems = "center";
    cardHeader.style.width = "100%";

    const titleDiv = document.createElement("div");
    titleDiv.className = "history-card-title";
    titleDiv.innerHTML = `<i class="fas fa-comment-alt" style="color:#9aa0a6; font-size:12px;"></i> ${conv.title}`;
    cardHeader.appendChild(titleDiv);

    const menuBtn = document.createElement("button");
    menuBtn.className = "conv-actions-btn";
    menuBtn.innerHTML = `<i class="fas fa-trash-alt"></i>`;
    menuBtn.onclick = (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    };
    cardHeader.appendChild(menuBtn);
    card.appendChild(cardHeader);

    const subtextDiv = document.createElement("div");
    subtextDiv.className = "history-card-subtext";
    subtextDiv.innerHTML = `<i class="fas ${icon}"></i> ${conv.target_name}`;
    subtextDiv.onclick = (e) => {
      e.stopPropagation();
      if (conv.type === "pdf") {
        openPreview(encodeURIComponent(conv.file_path), conv.target_name);
      } else {
        alert(`Directorio indexado del sistema: ${conv.file_path}`);
      }
    };
    card.appendChild(subtextDiv);
    container.appendChild(card);
  });
}

async function deleteConversation(id) {
  if (confirm("¿Seguro que deseas eliminar esta conversación del historial?")) {
    try {
      await fetch(`${API}/delete_conversation/?id=${id}`, { method: "POST" });
    } catch (e) {
      console.warn("No se pudo borrar en el servidor, eliminando localmente.", e);
    }
    
    addDeletedConversation(id);
    delete conversationsCache[id];
    
    if (activeConversationId === id) {
      newConversation();
    } else {
      renderSidebar();
    }
  }
}

async function loadConversation(id) {
  activeConversationId = id;
  const conv = conversationsCache[id];
  if (!conv) return;

  currentTab = conv.type;
  chatMessages[currentTab] = conv.history || [];

  if (conv.type === "pdf") {
    pdfReady = true;
    pdfLoadedName = conv.target_name;
  } else {
    folderReady = true;
  }

  showResultsView();
  renderHistory();
  refreshPdfBadge();
  scrollToBottom();

  document.querySelectorAll(".history-card").forEach(el => el.classList.remove("active"));
  const activeCard = document.getElementById(`sidebar-card-${id}`);
  if (activeCard) activeCard.classList.add("active");
}

function switchTab(tab) {
  currentTab = tab;

  const inResults = document.getElementById("results-view").style.display !== "none";
  const activeContainerId = inResults ? "panelContainerResults" : "panelContainerHome";
  const container = document.getElementById(activeContainerId);

  const panelPdf = document.getElementById("panelPdf");
  const panelFolder = document.getElementById("panelFolder");

  if (container && panelPdf && panelFolder) {
    if (panelPdf.parentNode !== container) container.appendChild(panelPdf);
    if (panelFolder.parentNode !== container) container.appendChild(panelFolder);
  }

  panelPdf.style.display    = tab === "pdf"    ? "block" : "none";
  panelFolder.style.display = tab === "folder" ? "block" : "none";

  const tabPdf = document.getElementById("tabPdf");
  const tabFolder = document.getElementById("tabFolder");
  const rtabPdf = document.getElementById("rtabPdf");
  const rtabFolder = document.getElementById("rtabFolder");
  
  if (tabPdf) tabPdf.classList.toggle("active", tab === "pdf");
  if (tabFolder) tabFolder.classList.toggle("active", tab === "folder");
  if (rtabPdf) rtabPdf.classList.toggle("active", tab === "pdf");
  if (rtabFolder) rtabFolder.classList.toggle("active", tab === "folder");

  renderHistory();
  refreshPdfBadge();
}

function refreshPdfBadge() {
  const b = document.getElementById("pdfActiveBadge");
  if (pdfReady && pdfLoadedName && b) {
    b.style.display = "inline-flex";
    b.textContent = `📄 PDF activo: ${pdfLoadedName}`;
  } else if (b) {
    b.style.display = "none";
  }
}

function onPdfSelected() {
  pdfFile = document.getElementById("pdfFileInput").files[0] || null;
  const fileNameSpan = document.getElementById("pdfFileName");
  if (fileNameSpan) fileNameSpan.textContent = pdfFile ? pdfFile.name : "Sin archivo";
}

async function processPdf() {
  if (!pdfFile) {
    showStatus("pdfStatus", "⚠️ Selecciona un PDF primero", "warn");
    return;
  }
  showStatus("pdfStatus", "⏳ Procesando texto y analizando planos visualmente...", "info");
  
  const cancelBtn = document.getElementById("cancelPdfBtn");
  if (cancelBtn) cancelBtn.style.display = "inline-flex";

  pdfAbortController = new AbortController();
  const fd = new FormData();
  fd.append("file", pdfFile);

  try {
    const res  = await fetch(`${API}/upload_pdf/`, { 
      method: "POST", 
      body: fd,
      signal: pdfAbortController.signal
    });
    const data = await res.json();
    if (res.ok) {
      pdfReady = true;
      pdfLoadedName = pdfFile.name;
      activeConversationId = data.conversation_id;
      showStatus("pdfStatus", `✅ PDF procesado con éxito`, "ok");
      await fetchConversations();
      await loadConversation(activeConversationId);
    } else {
      showStatus("pdfStatus", `❌ ${data.error}`, "error");
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      showStatus("pdfStatus", "🛑 Lectura e interpretación de PDF cancelada por el usuario.", "warn");
    } else {
      showStatus("pdfStatus", "❌ Error de conexión con el servidor backend", "error");
    }
  } finally {
    if (cancelBtn) cancelBtn.style.display = "none";
    pdfAbortController = null;
  }
}

function cancelPdfProcessing() {
  if (pdfAbortController) {
    pdfAbortController.abort();
  }
}

async function browseFolder() {
  const btn = document.querySelector('.browse-folder-btn');
  if (btn) {
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Abriendo...';
    btn.disabled = true;
  }
  try {
    const res  = await fetch(`${API}/browse_folder/`, { method: "POST" });
    const data = await res.json();

    if (res.ok && data.path) {
      document.getElementById("folderPathInput").value = data.path;
      showStatus("folderStatus", `📁 Carpeta seleccionada: ${data.path}`, "ok");
    } else if (res.ok && !data.path) {
      // El usuario canceló el diálogo
    } else {
      showStatus("folderStatus", `❌ ${data.error || "No se pudo abrir el selector"}`, "error");
    }
  } catch {
    showStatus("folderStatus", "❌ Error de conexión con el servidor backend", "error");
  } finally {
    if (btn) {
      btn.innerHTML = '<i class="fas fa-folder-open"></i> Buscar';
      btn.disabled = false;
    }
  }
}

async function indexFolder() {
  const pathInput = document.getElementById("folderPathInput");
  const path = pathInput ? pathInput.value.trim() : "";
  if (!path) {
    showStatus("folderStatus", "⚠️ Escribe una ruta válida", "warn");
    return;
  }
  showStatus("folderStatus", "⏳ Indexando carpeta recursivamente (extrayendo planos)...", "info");

  const cancelBtn = document.getElementById("cancelFolderBtn");
  if (cancelBtn) cancelBtn.style.display = "inline-flex";

  folderAbortController = new AbortController();
  const fd = new FormData();
  fd.append("folder_path", path);

  try {
    const res  = await fetch(`${API}/index_folder/`, { 
      method: "POST", 
      body: fd,
      signal: folderAbortController.signal
    });
    const data = await res.json();
    if (res.ok) {
      folderReady = true;
      activeConversationId = data.conversation_id;
      showStatus("folderStatus", `✅ Indexación completada.`, "ok");
      await fetchConversations();
      await loadConversation(activeConversationId);
    } else {
      showStatus("folderStatus", `❌ ${data.error}`, "error");
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      showStatus("folderStatus", "🛑 Indexación del directorio cancelada por el usuario.", "warn");
    } else {
      showStatus("folderStatus", "❌ Error de conexión con el servidor backend", "error");
    }
  } finally {
    if (cancelBtn) cancelBtn.style.display = "none";
    folderAbortController = null;
  }
}

function cancelFolderProcessing() {
  if (folderAbortController) {
    folderAbortController.abort();
  }
}

function doSearch() {
  const inResults = document.getElementById("results-view").style.display !== "none";
  const input = document.getElementById(inResults ? "searchInputResults" : "searchInput");
  const q = input ? input.value.trim() : "";
  if (!q) return;
  showResultsView();
  if (input) input.value = "";
  askQuestion(q);
}

const searchInput = document.getElementById("searchInput");
if (searchInput) {
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch();
  });
}

async function askQuestion(q) {
  if (!activeConversationId) {
    alert("❌ Sube un documento o selecciona una conversación del historial antes de preguntar.");
    return;
  }

  chatMessages[currentTab].push({ role: "user", content: q });
  renderHistory();
  scrollToBottom();
  showTyping();

  const fd = new FormData();
  fd.append("question", q);
  fd.append("conversation_id", activeConversationId);

  let endpoint;
  if (currentTab === "pdf") {
    const styleSelect = document.getElementById("styleSelect");
    const style = styleSelect ? styleSelect.value : "normal";
    fd.append("style", style);
    endpoint = `${API}/ask_pdf/`;
  } else {
    endpoint = `${API}/ask_folder/`;
  }

  try {
    const res  = await fetch(endpoint, { method: "POST", body: fd });
    const data = await res.json();
    hideTyping();
    await fetchConversations();
    await loadConversation(activeConversationId);
    scrollToBottom();
  } catch {
    hideTyping();
    alert("❌ Error crítico: No se pudo establecer conexión con la API.");
  }
}

function renderHistory() {
  const container = document.getElementById("chatHistory");
  if (!container) return;
  const msgs = chatMessages[currentTab] || [];

  container.innerHTML = msgs.map(m => `
    <div class="chat-bubble ${m.role}">
      <div class="bubble-icon ${m.role === 'user' ? 'user-icon' : 'bot-icon'}">
        <i class="fas ${m.role === 'user' ? 'fa-user' : 'fa-robot'}"></i>
      </div>
      <div class="bubble-text">
        <div>${(m.content || "").replace(/\n/g, "<br>")}</div>
        ${m.sources && m.sources.length > 0 ? `
          <div style="margin-top:12px;font-size:11px;color:#70757a;border-top:1px dashed #dfe1e5;padding-top:6px;">
            <strong>Documentos Fuente (Clic para Vista Previa):</strong><br>
            ${m.sources.map(src => {
              const baseName = src.split(/[\\/]/).pop();
              const safeSrc  = encodeURIComponent(src);
              return `<button class="source-btn" onclick="openPreview('${safeSrc}','${baseName}')">
                        <i class="fas fa-file-pdf"></i> ${baseName}
                      </button>`;
            }).join("")}
          </div>
        ` : ''}
      </div>
    </div>
  `).join("");
}

function showTyping() {
  const aiOverview = document.getElementById("aiOverview");
  const aiTyping = document.getElementById("aiTyping");
  if (aiOverview) aiOverview.style.display = "block";
  if (aiTyping) aiTyping.style.display = "flex";
}

function hideTyping() {
  const aiTyping = document.getElementById("aiTyping");
  const aiOverview = document.getElementById("aiOverview");
  if (aiTyping) aiTyping.style.display = "none";
  if (aiOverview && !document.querySelector("#chatHistory .chat-bubble.assistant:last-child")) {
    aiOverview.style.display = "none";
  }
}

function showResultsView() {
  const mainView = document.getElementById("main-view");
  const mainFooter = document.getElementById("main-footer");
  const resultsView = document.getElementById("results-view");
  
  if (mainView) mainView.style.display = "none";
  if (mainFooter) mainFooter.style.display = "none";
  if (resultsView) resultsView.style.display = "flex";
  
  switchTab(currentTab);
  
  if (resultsView) resultsView.scrollTop = 0;
}

function openPreview(encodedPath, fileName) {
  const path = decodeURIComponent(encodedPath);
  const modalTitle = document.getElementById("modalTitle");
  const previewIframe = document.getElementById("previewIframe");
  const previewModal = document.getElementById("previewModal");
  
  if (modalTitle) modalTitle.textContent = `Vista Previa Completa: ${fileName}`;
  if (previewIframe) previewIframe.src = `${API}/preview/?path=${encodeURIComponent(path)}`;
  if (previewModal) previewModal.style.display = "flex";
}

function closePreview() {
  const previewModal = document.getElementById("previewModal");
  const previewIframe = document.getElementById("previewIframe");
  if (previewModal) previewModal.style.display = "none";
  if (previewIframe) previewIframe.src = "";
}

async function backToHome() {
  const mainView = document.getElementById("main-view");
  const mainFooter = document.getElementById("main-footer");
  const resultsView = document.getElementById("results-view");
  
  if (mainView) mainView.style.display = "flex";
  if (mainFooter) mainFooter.style.display = "block";
  if (resultsView) resultsView.style.display = "none";

  document.querySelectorAll(".history-card").forEach(el => el.classList.remove("active"));

  if (activeConversationId) {
    const card = document.getElementById(`sidebar-card-${activeConversationId}`);
    if (card) card.classList.add("active");
  }

  switchTab(currentTab); 
  fetchConversations();
}

async function newConversation() {
  activeConversationId = null;
  pdfReady = false;
  folderReady = false;
  pdfFile = null;
  pdfLoadedName = "";
  chatMessages = { pdf: [], folder: [] };

  const pdfInput = document.getElementById("pdfFileInput");
  if (pdfInput) pdfInput.value = "";
  const pdfFileName = document.getElementById("pdfFileName");
  if (pdfFileName) pdfFileName.textContent = "Sin archivo";
  const folderPathInput = document.getElementById("folderPathInput");
  if (folderPathInput) folderPathInput.value = "";
  const searchInput1 = document.getElementById("searchInput");
  const searchInput2 = document.getElementById("searchInputResults");
  if (searchInput1) searchInput1.value = "";
  if (searchInput2) searchInput2.value = "";

  const pdfStatus = document.getElementById("pdfStatus");
  const folderStatus = document.getElementById("folderStatus");
  const pdfActiveBadge = document.getElementById("pdfActiveBadge");
  
  if (pdfStatus) pdfStatus.style.display = "none";
  if (folderStatus) folderStatus.style.display = "none";
  if (pdfActiveBadge) pdfActiveBadge.style.display = "none";

  const mainView = document.getElementById("main-view");
  const mainFooter = document.getElementById("main-footer");
  const resultsView = document.getElementById("results-view");
  
  if (mainView) mainView.style.display = "flex";
  if (mainFooter) mainFooter.style.display = "block";
  if (resultsView) resultsView.style.display = "none";

  document.querySelectorAll(".history-card").forEach(el => el.classList.remove("active"));
  switchTab("pdf");
  fetchConversations();
}

function clearPdfChat() {
  const pdfInput = document.getElementById("pdfFileInput");
  if (pdfInput) pdfInput.value = "";
  pdfFile = null;
  const pdfFileName = document.getElementById("pdfFileName");
  if (pdfFileName) pdfFileName.textContent = "Sin archivo";
  const pdfStatus = document.getElementById("pdfStatus");
  if (pdfStatus) pdfStatus.style.display = "none";
}

function clearIndex() {
  const folderInput = document.getElementById("folderPathInput");
  if (folderInput) folderInput.value = "";
  const folderStatus = document.getElementById("folderStatus");
  if (folderStatus) folderStatus.style.display = "none";
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = "inline-flex";
  el.textContent = msg;
  el.className = `status-badge status-${type}`;
}

function scrollToBottom() {
  setTimeout(() => {
    const resultsView = document.getElementById("results-view");
    const mainContent = document.querySelector('.main-app-content');
    const scrollTarget = resultsView && resultsView.style.display !== "none" ? resultsView : mainContent;
    if (scrollTarget) {
      scrollTarget.scrollTo({ top: scrollTarget.scrollHeight, behavior: "smooth" });
    }
  }, 100);
}
</script>
