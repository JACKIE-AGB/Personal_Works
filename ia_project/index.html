<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFE Intelligent Search</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ═══════════════════════════════════════════════
       LAYOUT PRINCIPAL
    ═══════════════════════════════════════════════ */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* ═══════════════════════════════════════════════
       BARRA LATERAL — con soporte de colapso
    ═══════════════════════════════════════════════ */
    .sidebar {
      width: 280px;
      min-width: 280px;
      background-color: #131314;
      color: #e3e3e3;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      box-sizing: border-box;
      border-right: 1px solid #303134;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      /* Transición suave al contraer/expandir */
      transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease, border 0.3s ease;
    }

    /* Estado colapsado */
    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border-right: none;
    }

    .sidebar-header {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
      padding-left: 8px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    /*
    ══════════════════════════════════════════════════
    LOGO CFE OFICIAL — Pega la URL del logo aquí:
    Reemplaza "URL_LOGO_CFE_AQUI" en el atributo src
    del <img> dentro de .sidebar-header (línea ~165 HTML)
    ══════════════════════════════════════════════════
    */
    .cfe-logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .new-chat-btn {
      background: #1e1e1f;
      color: #e3e3e3;
      border: none;
      padding: 12px 16px;
      border-radius: 24px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      font-weight: 500;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .new-chat-btn:hover { background: #2b2b2c; }

    .sidebar-menu-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #c4c7c5;
      margin-bottom: 4px;
      white-space: nowrap;
    }
    .sidebar-menu-item:hover {
      background: #1e1e1f;
      color: #ffffff;
    }

    .sidebar-section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: #7c7f82;
      margin: 20px 0 10px 8px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .history-card {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .history-card:hover,
    .history-card.active { background: #1e1e1f; }

    .history-card-title {
      font-size: 14px;
      color: #e3e3e3;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-card-subtext {
      font-size: 11px;
      color: #80868b;
      padding-left: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
    }
    .history-card-subtext:hover {
      color: #1a73e8;
      text-decoration: underline;
    }

    /* ═══════════════════════════════════════════════
       CONTENEDOR PRINCIPAL
    ═══════════════════════════════════════════════ */
    .main-app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      position: relative;
      min-width: 0;
    }

    /* ═══════════════════════════════════════════════
       BOTÓN HAMBURGUESA (contraer / expandir sidebar)
    ═══════════════════════════════════════════════ */
    .hamburger-btn {
      background: none;
      border: none;
      color: #5f6368;
      font-size: 18px;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .hamburger-btn:hover { background: rgba(60,64,67,.08); }

    /* ═══════════════════════════════════════════════
       HERO — CARRUSEL DE IMÁGENES DE LA CENTRAL
    ═══════════════════════════════════════════════ */
    .hero-carousel-section {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
      background: #ebebeb;
      flex-shrink: 0;
    }

    .hero-slides-wrapper {
      position: absolute;
      inset: 0;
    }

    /* Cada slide se genera dinámicamente por JS */
    .hero-slide {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transform: translateX(100%);
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity  0.85s ease;
    }
    .hero-slide.active {
      opacity: 1;
      transform: translateX(0);
    }
    .hero-slide.exiting {
      opacity: 0;
      transform: translateX(-100%);
    }

    /* Texto placeholder "Libro final" — visible hasta que se carguen imágenes */
    .hero-placeholder-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 54px;
      font-weight: 300;
      color: #b5b5b5;
      letter-spacing: 3px;
      pointer-events: none;
      user-select: none;
      font-family: 'Google Sans', Arial, sans-serif;
      z-index: 2;
      white-space: nowrap;
    }

    /* Indicadores puntitos del carrusel */
    .hero-indicators {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 3;
    }
    .hero-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .hero-dot.active {
      background: rgba(255,255,255,0.95);
      transform: scale(1.35);
    }

    /* ═══════════════════════════════════════════════
       ÁREA DE BÚSQUEDA (wrapper con padding)
    ═══════════════════════════════════════════════ */
    .search-area-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 28px 20px 10px;
      box-sizing: border-box;
    }

    /* ═══════════════════════════════════════════════
       SECCIÓN BORROSA — espejo sincronizado del carrusel
    ═══════════════════════════════════════════════ */
    .blurred-mirror-section {
      width: 100%;
      flex: 1;
      min-height: 80px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #e0e0e0;
      filter: blur(24px) brightness(0.60);
      transform: scale(1.12); /* evita bordes blancos del blur */
      transition: background-image 0.85s ease;
    }

    /* ═══════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════ */
    .preview-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-content {
      background: #ffffff;
      width: 90%; height: 90%;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .modal-header {
      background: #f1f3f4;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dadce0;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: #202124;
      font-family: Arial, sans-serif;
    }
    .close-modal {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #5f6368;
    }
    .close-modal:hover { color: #000000; }
    .modal-body { flex: 1; background: #525659; }

    .source-btn {
      background: #f1f3f4;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 5px 10px;
      margin: 4px 4px 0 0;
      cursor: pointer;
      font-size: 11px;
      color: #1a73e8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .source-btn:hover { background: #e8f0fe; }

    .panel-container {
      width: 100%;
      margin-bottom: 15px;
    }
    .results-action-area {
      padding: 10px 20px;
      background: #fafafa;
      border-bottom: 1px solid #eceff1;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ═══════════════════════════════════════════
       BARRA LATERAL
  ═══════════════════════════════════════════ -->

    <div class="sidebar-header">
      <!--
        ╔═══════════════════════════════════════════╗
        ║  LOGO CFE OFICIAL                         ║
        ║  Reemplaza "URL_LOGO_CFE_AQUI" con la URL ║
        ║  real del logo de CFE (PNG o SVG).         ║

      <div class="header-links">
        <a href="#">Gmail</a>

    </header>

    <!-- ═════════════════════════════════════════

      <div class="hero-carousel-section" id="heroCarouselSection">

        <!-- Texto placeholder: visible hasta que se asignen imágenes reales -->

<script>
/* ══════════════════════════════════════════════════════
   ╔═══════════════════════════════════════════════════╗
   ║  CARRUSEL — PEGA AQUÍ LAS URLs DE LAS 5 IMÁGENES ║
   ║  Reemplaza cada "URL_IMAGEN_X_AQUI" con la        ║
   ║  URL real de tu imagen de la central.             ║
   ╚═══════════════════════════════════════════════════╝
══════════════════════════════════════════════════════ */
const CAROUSEL_IMAGES = [
  "imagen1.jfif",   // ← Pega aquí la URL de la imagen 1
  "imagen2.jfif",   // ← Pega aquí la URL de la imagen 2
  "imagen3.jfif",   // ← Pega aquí la URL de la imagen 3
  "imagen4.jfif",   // ← Pega aquí la URL de la imagen 4
  "imagen5.jfif",   // ← Pega aquí la URL de la imagen 5
];

/* Intervalo del carrusel: 3 minutos = 180 000 ms */
const CAROUSEL_INTERVAL_MS = 180000;

/* ═══════════════════════════════════════════════════
   INICIALIZACIÓN DEL CARRUSEL
═══════════════════════════════════════════════════ */
let currentHeroSlide = 0;
let carouselTimer = null;

function initCarousel() {
  const wrapper    = document.getElementById('heroSlidesWrapper');
  const indicators = document.getElementById('heroIndicators');
  const placeholder = document.getElementById('heroPlaceholder');
  const blurred    = document.getElementById('blurredMirror');

  /* Detectar si hay URLs reales (no placeholder) */
  const hasRealImages = CAROUSEL_IMAGES.some(url => url.startsWith('http'));
  if (hasRealImages) {
    placeholder.style.display = 'none';
  }

  /* Crear slides e indicadores */
  CAROUSEL_IMAGES.forEach((url, i) => {
    /* Slide */
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.style.backgroundImage = `url('${url}')`;
    wrapper.appendChild(slide);

    /* Indicador (puntito) */
    const dot = document.createElement('div');
    dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => goToSlide(i));
    indicators.appendChild(dot);
  });

  /* Espejo borroso: sincronizar con la primera imagen */
  syncBlurred(CAROUSEL_IMAGES[0]);

  /* Iniciar temporizador automático */
  carouselTimer = setInterval(nextHeroSlide, CAROUSEL_INTERVAL_MS);
}

/* Cambiar a un slide específico */
function goToSlide(index) {
  if (index === currentHeroSlide) return;

  const slides = document.querySelectorAll('.hero-slide');
  const dots   = document.querySelectorAll('.hero-dot');

  /* Salida del slide actual (desliza a la izquierda) */
  slides[currentHeroSlide].classList.remove('active');
  slides[currentHeroSlide].classList.add('exiting');

  /* Limpieza tras la animación */
  const exiting = slides[currentHeroSlide];
  setTimeout(() => exiting.classList.remove('exiting'), 900);

  /* Entrada del nuevo slide (viene de la derecha) */
  currentHeroSlide = index;
  slides[currentHeroSlide].classList.add('active');

  /* Sincronizar espejo borroso */
  syncBlurred(CAROUSEL_IMAGES[currentHeroSlide]);

  /* Actualizar indicadores */
  dots.forEach((d, i) => d.classList.toggle('active', i === currentHeroSlide));
}

function nextHeroSlide() {
  goToSlide((currentHeroSlide + 1) % CAROUSEL_IMAGES.length);
}

/* Actualizar la sección borrosa con la imagen actual */
function syncBlurred(imageUrl) {
  const blurred = document.getElementById('blurredMirror');
  if (blurred) blurred.style.backgroundImage = `url('${imageUrl}')`;
}

/* ═══════════════════════════════════════════════════
   BARRA LATERAL — CONTRAER / EXPANDIR
═══════════════════════════════════════════════════ */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
}

/* ═══════════════════════════════════════════════════
   LÓGICA ORIGINAL DE LA APP (sin cambios)
═══════════════════════════════════════════════════ */
const API = "http://127.0.0.1:8001";
let currentTab = "pdf";

let activeConversationId = null;
let conversationsCache = {};

let pdfReady = false;
let folderReady = false;
let pdfFile = null;
let pdfLoadedName = "";

let chatMessages = {
  pdf: [],
  folder: []
};

window.addEventListener("DOMContentLoaded", () => {
  initCarousel();   /* ← Inicializar carrusel al cargar */
  switchTab("pdf");
  fetchConversations();
});

async function fetchConversations() {
  try {
    const res = await fetch(`${API}/conversations/`);
    if (!res.ok) return;
    conversationsCache = await res.json();
    renderSidebar();
  } catch (e) {
    console.error("Error cargando historial de barra lateral", e);
  }
}

function renderSidebar() {
  const container = document.getElementById("sidebarHistoryList");
  container.innerHTML = "";

  Object.values(conversationsCache).reverse().forEach(conv => {
    const isSelected = conv.id === activeConversationId ? "active" : "";
    const icon = conv.type === "pdf" ? "fa-file-pdf" : "fa-folder-open";

    const card = document.createElement("div");
    card.className = `history-card ${isSelected}`;
    card.id = `sidebar-card-${conv.id}`;
    card.onclick = () => loadConversation(conv.id);

    const titleDiv = document.createElement("div");
    titleDiv.className = "history-card-title";
    titleDiv.innerHTML = `<i class="fas fa-comment-alt" style="color:#9aa0a6; font-size:12px;"></i> ${conv.title}`;
    card.appendChild(titleDiv);

    const subtextDiv = document.createElement("div");
    subtextDiv.className = "history-card-subtext";
    subtextDiv.innerHTML = `<i class="fas ${icon}"></i> ${conv.target_name}`;
    subtextDiv.onclick = (e) => {
      e.stopPropagation();
      if (conv.type === "pdf") {
        openPreview(encodeURIComponent(conv.file_path), conv.target_name);
      } else {
        alert(`Directorio indexado del sistema: ${conv.file_path}`);
      }
    };
    card.appendChild(subtextDiv);
    container.appendChild(card);
  });
}

async function loadConversation(id) {
  activeConversationId = id;
  const conv = conversationsCache[id];
  if (!conv) return;

  currentTab = conv.type;
  chatMessages[currentTab] = conv.history;

  if (conv.type === "pdf") {
    pdfReady = true;
    pdfLoadedName = conv.target_name;
  } else {
    folderReady = true;
  }

  showResultsView();
  renderHistory();
  refreshPdfBadge();

  document.querySelectorAll(".history-card").forEach(el => el.classList.remove("active"));
  const activeCard = document.getElementById(`sidebar-card-${id}`);
  if (activeCard) activeCard.classList.add("active");
}

function switchTab(tab) {
  currentTab = tab;

  const inResults = document.getElementById("results-view").style.display !== "none";
  const activeContainerId = inResults ? "panelContainerResults" : "panelContainerHome";
  const container = document.getElementById(activeContainerId);

  const panelPdf = document.getElementById("panelPdf");
  const panelFolder = document.getElementById("panelFolder");

  if (container && panelPdf && panelFolder) {
    container.appendChild(panelPdf);
    container.appendChild(panelFolder);
  }

  panelPdf.style.display    = tab === "pdf"    ? "block" : "none";
  panelFolder.style.display = tab === "folder" ? "block" : "none";

  document.getElementById("tabPdf").classList.toggle("active", tab === "pdf");
  document.getElementById("tabFolder").classList.toggle("active", tab === "folder");
  document.getElementById("rtabPdf").classList.toggle("active", tab === "pdf");
  document.getElementById("rtabFolder").classList.toggle("active", tab === "folder");

  renderHistory();
  refreshPdfBadge();
}

function refreshPdfBadge() {
  const b = document.getElementById("pdfActiveBadge");
  if (pdfReady && pdfLoadedName) {
    b.style.display = "inline-flex";
    b.textContent = `📄 PDF activo: ${pdfLoadedName}`;
  } else {
    b.style.display = "none";
  }
}

function onPdfSelected() {
  pdfFile = document.getElementById("pdfFileInput").files[0] || null;
  document.getElementById("pdfFileName").textContent = pdfFile ? pdfFile.name : "Sin archivo";
}

async function processPdf() {
  if (!pdfFile) {
    showStatus("pdfStatus", "⚠️ Selecciona un PDF primero", "warn");
    return;
  }
  showStatus("pdfStatus", "⏳ Procesando texto y analizando planos visualmente...", "info");

  const fd = new FormData();
  fd.append("file", pdfFile);

  try {
    const res  = await fetch(`${API}/upload_pdf/`, { method: "POST", body: fd });
    const data = await res.json();
    if (res.ok) {
      pdfReady = true;
      pdfLoadedName = pdfFile.name;
      activeConversationId = data.conversation_id;
      showStatus("pdfStatus", `✅ PDF procesado con éxito`, "ok");
      await fetchConversations();
      await loadConversation(activeConversationId);
    } else {
      showStatus("pdfStatus", `❌ ${data.error}`, "error");
    }
  } catch {
    showStatus("pdfStatus", "❌ Error de conexión con el servidor backend", "error");
  }
}

async function indexFolder() {
  const path = document.getElementById("folderPathInput").value.trim();
  if (!path) {
    showStatus("folderStatus", "⚠️ Escribe una ruta válida", "warn");
    return;
  }
  showStatus("folderStatus", "⏳ Indexando carpeta recursivamente (extrayendo planos)...", "info");

  const fd = new FormData();
  fd.append("folder_path", path);

  try {
    const res  = await fetch(`${API}/index_folder/`, { method: "POST", body: fd });
    const data = await res.json();
    if (res.ok) {
      folderReady = true;
      activeConversationId = data.conversation_id;
      showStatus("folderStatus", `✅ Indexación completada.`, "ok");
      await fetchConversations();
      await loadConversation(activeConversationId);
    } else {
      showStatus("folderStatus", `❌ ${data.error}`, "error");
    }
  } catch {
    showStatus("folderStatus", "❌ Error de conexión con el servidor backend", "error");
  }
}

function doSearch() {
  const inResults = document.getElementById("results-view").style.display !== "none";
  const input = document.getElementById(inResults ? "searchInputResults" : "searchInput");
  const q = input.value.trim();
  if (!q) return;
  showResultsView();
  input.value = "";
  askQuestion(q);
}

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

async function askQuestion(q) {
  if (!activeConversationId) {
    alert("❌ Sube un documento o selecciona una conversación del historial antes de preguntar.");
    return;
  }

  chatMessages[currentTab].push({ role: "user", content: q });
  renderHistory();
  scrollToBottom();
  showTyping();

  const fd = new FormData();
  fd.append("question", q);
  fd.append("conversation_id", activeConversationId);

  let endpoint;
  if (currentTab === "pdf") {
    const style = document.getElementById("styleSelect").value;
    fd.append("style", style);
    endpoint = `${API}/ask_pdf/`;
  } else {
    endpoint = `${API}/ask_folder/`;
  }

  try {
    const res  = await fetch(endpoint, { method: "POST", body: fd });
    const data = await res.json();
    hideTyping();
    await fetchConversations();
    await loadConversation(activeConversationId);
  } catch {
    hideTyping();
    alert("❌ Error crítico: No se pudo establecer conexión con la API.");
  }
}

function renderHistory() {
  const container = document.getElementById("chatHistory");
  const msgs = chatMessages[currentTab] || [];

  container.innerHTML = msgs.map(m => `
    <div class="chat-bubble ${m.role}">
      <div class="bubble-icon ${m.role === 'user' ? 'user-icon' : 'bot-icon'}">
        <i class="fas ${m.role === 'user' ? 'fa-user' : 'fa-robot'}"></i>
      </div>
      <div class="bubble-text">
        <div>${m.content.replace(/\n/g, "<br>")}</div>
        ${m.sources && m.sources.length > 0 ? `
          <div style="margin-top:12px;font-size:11px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px;">
            <strong>Documentos Fuente (Clic para Vista Previa):</strong><br>
            ${m.sources.map(src => {
              const baseName = src.split(/[\\/]/).pop();
              const safeSrc  = encodeURIComponent(src);
              return `<button class="source-btn" onclick="openPreview('${safeSrc}','${baseName}')">
                        <i class="fas fa-file-pdf"></i> ${baseName}
                      </button>`;
            }).join("")}
          </div>
        ` : ''}
      </div>
    </div>
  `).join("");
}

function showTyping() {
  document.getElementById("aiOverview").style.display = "block";
  document.getElementById("aiTyping").style.display = "flex";
}

function hideTyping() {
  document.getElementById("aiTyping").style.display = "none";
  document.getElementById("aiOverview").style.display = "none";
}

function showResultsView() {
  document.getElementById("main-view").style.display = "none";
  document.getElementById("main-footer").style.display = "none";
  document.getElementById("results-view").style.display = "block";
  switchTab(currentTab);
}

function openPreview(encodedPath, fileName) {
  const path = decodeURIComponent(encodedPath);
  document.getElementById("modalTitle").textContent = `Vista Previa Completa: ${fileName}`;
  document.getElementById("previewIframe").src = `${API}/preview/?path=${encodeURIComponent(path)}`;
  document.getElementById("previewModal").style.display = "flex";
}

function closePreview() {
  document.getElementById("previewModal").style.display = "none";
  document.getElementById("previewIframe").src = "";
}

async function backToHome() {
  activeConversationId = null;
  pdfReady = false;
  folderReady = false;
  pdfFile = null;
  pdfLoadedName = "";

  document.getElementById("pdfFileInput").value = "";
  document.getElementById("pdfFileName").textContent = "Sin archivo";
  document.getElementById("folderPathInput").value = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("searchInputResults").value = "";

  document.getElementById("pdfStatus").style.display = "none";
  document.getElementById("folderStatus").style.display = "none";
  document.getElementById("pdfActiveBadge").style.display = "none";

  document.getElementById("main-view").style.display = "flex";
  document.getElementById("main-footer").style.display = "block";
  document.getElementById("results-view").style.display = "none";

  document.querySelectorAll(".history-card").forEach(el => el.classList.remove("active"));
  switchTab("pdf");
  fetchConversations();
}

async function clearPdfChat() {
  if (confirm("¿Seguro que deseas purgar la base de datos del servidor por completo?")) {
    try {
      await fetch(`${API}/clear_index/`, { method: "POST" });
      backToHome();
    } catch {
      alert("Error limpiando el backend");
    }
  }
}

async function clearIndex() {
  await clearPdfChat();
}

function showStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.style.display = "inline-flex";
  el.textContent = msg;
  el.className = `status-badge status-${type}`;
}

function scrollToBottom() {
  setTimeout(() => {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }, 50);
}
</script>
</body>
</html>
