<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Geometry Dash JS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; background: linear-gradient(#005f73, #0a9396); }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">Puntos: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');

// Ajuste de pantalla
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- Configuración y Mecánicas ---
const gravity = 0.8;
const jumpForce = -15;
let score = 0;
let gameActive = true;

const player = {
    x: 100,
    y: canvas.height - 150,
    size: 40,
    vy: 0,
    rotation: 0,
    isGrounded: false,
    color: '#00ffcc', // Skin personalizada (Neon Cyan)
    innerColor: '#00332a'
};

let obstacles = [];
let frameCount = 0;

// --- Funciones de Control ---
function handleJump() {
    if (player.isGrounded && gameActive) {
        player.vy = jumpForce;
        player.isGrounded = false;
    } else if (!gameActive) {
        resetGame();
    }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space') handleJump(); });
window.addEventListener('mousedown', handleJump);

function resetGame() {
    score = 0;
    obstacles = [];
    player.y = canvas.height - 150;
    player.vy = 0;
    player.rotation = 0;
    gameActive = true;
    animate();
}

// --- Lógica de Objetos (Obstáculos) ---
function spawnObstacle() {
    const minGap = 80;
    const height = 50 + Math.random() * 30;
    obstacles.push({
        x: canvas.width + 100,
        y: canvas.height - 100,
        width: 40,
        height: height,
        speed: 8 + (score / 5) // Dificultad progresiva
    });
}

// --- Ciclo Principal ---
function animate() {
    if (!gameActive) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frameCount++;

    // 1. Dibujar Suelo
    ctx.fillStyle = '#001219';
    ctx.fillRect(0, canvas.height - 100, canvas.width, 100);

    // 2. Física del Jugador
    player.vy += gravity;
    player.y += player.vy;

    // Colisión con el suelo
    if (player.y + player.size > canvas.height - 100) {
        player.y = canvas.height - 100 - player.size;
        player.vy = 0;
        player.isGrounded = true;
        // Alinear rotación al aterrizar (múltiplos de 90 grados)
        player.rotation = Math.round(player.rotation / 90) * 90;
    } else {
        // Animación de rotación en el aire
        player.rotation += 5; 
    }

    // 3. Dibujar Jugador (Skin Personalizada)
    ctx.save();
    ctx.translate(player.x + player.size/2, player.y + player.size/2);
    ctx.rotate(player.rotation * Math.PI / 180);
    
    // Cuerpo principal
    ctx.fillStyle = player.color;
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    // Detalle de skin (ojo/núcleo)
    ctx.fillStyle = player.innerColor;
    ctx.fillRect(-10, -10, 20, 20);
    ctx.strokeStyle = "white";
    ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.restore();

    // 4. Gestión de Obstáculos (Fuera de pantalla y Colisiones)
    if (frameCount % 70 === 0) spawnObstacle();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= obs.speed;

        // Dibujar obstáculo (triángulo clásico)
        ctx.fillStyle = "#ff4d6d";
        ctx.beginPath();
        ctx.moveTo(obs.x, canvas.height - 100);
        ctx.lineTo(obs.x + obs.width / 2, canvas.height - 100 - obs.height);
        ctx.lineTo(obs.x + obs.width, canvas.height - 100);
        ctx.fill();

        // Colisión AABB simplificada para el cubo
        if (
            player.x < obs.x + obs.width &&
            player.x + player.size > obs.x &&
            player.y + player.size > canvas.height - 100 - obs.height
        ) {
            gameActive = false;
            alert("¡Game Over! Puntos: " + score);
            resetGame();
        }

        // Eliminar si sale de pantalla y sumar puntos
        if (obs.x + obs.width < 0) {
            obstacles.splice(i, 1);
            score++;
            scoreElement.innerText = score;
        }
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
