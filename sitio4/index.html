<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Tablas Escolares</title>
</head>

<body>

<h1>Panel de Control Escolar</h1>

<h2>Tabla Alumnos</h2>

<div class="search-bar">
    <select id="campo-alumnos">
        <option value="todos">Todos los campos</option>
        <option value="0">Alumno ID</option>
        <option value="1">Nombre</option>
        <option value="2">Apellido</option>
        <option value="3">Fecha Nacimiento</option>
        <option value="4">Teléfono</option>
        <option value="5">Email</option>
    </select>
    <input type="text" id="buscar-alumnos" placeholder="Buscar alumno...">
    <button type="button" class="btn-search" onclick="buscarRegistros('tbody-alumnos', 'buscar-alumnos', 'campo-alumnos')">Buscar</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Alumno ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fecha Nacimiento</th>
                <th>Teléfono</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tbody-alumnos">
            <!-- Los registros se cargan automáticamente con JS -->
        </tbody>
        <tfoot>
            <tr id="form-alumnos">
                <td><input type="number" name="alumno_id" placeholder="ID" required></td>
                <td><input type="text" name="nombre" placeholder="Nombre" required></td>
                <td><input type="text" name="apellido" placeholder="Apellido" required></td>
                <td><input type="date" name="fecha_nacimiento"></td>
                <td><input type="text" name="telefono" placeholder="Teléfono"></td>
                <td><input type="email" name="email" placeholder="Email"></td>
            </tr>
            <tr>
                <td colspan="6">
                    <button type="button" onclick="agregarRegistro('alumnos')">Agregar Alumno</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<h2>Tabla Colegiatura</h2>

<div class="search-bar">
    <select id="campo-colegiaturas">
        <option value="todos">Todos los campos</option>
        <option value="0">Colegiatura ID</option>
        <option value="1">Alumno ID</option>
        <option value="2">Monto</option>
        <option value="3">Mes Pago</option>
        <option value="4">Fecha Pago</option>
        <option value="5">Estado Pago</option>
    </select>
    <input type="text" id="buscar-colegiaturas" placeholder="Buscar colegiatura...">
    <button type="button" class="btn-search" onclick="buscarRegistros('tbody-colegiaturas', 'buscar-colegiaturas', 'campo-colegiaturas')">Buscar</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Colegiatura ID</th>
                <th>Alumno ID</th>
                <th>Monto</th>
                <th>Mes Pago</th>
                <th>Fecha Pago</th>
                <th>Estado Pago</th>
            </tr>
        </thead>
        <tbody id="tbody-colegiaturas">
        </tbody>
        <tfoot>
            <tr id="form-colegiaturas">
                <td><input type="number" name="colegiatura_id" placeholder="ID" required></td>
                <td><input type="number" name="alumno_id" placeholder="Alumno ID" required></td>
                <td><input type="number" step="0.01" name="monto" placeholder="Monto" required></td>
                <td><input type="text" name="mes_pagado" placeholder="Mes"></td>
                <td><input type="date" name="fecha_pago"></td>
                <td>
                    <select name="estado_pago">
                        <option value="Pagado">Pagado</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="6">
                    <button type="button" onclick="agregarRegistro('colegiaturas')">Agregar Colegiatura</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<h2>Tabla Calificaciones</h2>

<div class="search-bar">
    <select id="campo-calificaciones">
        <option value="todos">Todos los campos</option>
        <option value="0">Calificación ID</option>
        <option value="1">Alumno ID</option>
        <option value="2">Materia</option>
        <option value="3">Nota</option>
        <option value="4">Periodo</option>
    </select>
    <input type="text" id="buscar-calificaciones" placeholder="Buscar calificación...">
    <button type="button" class="btn-search" onclick="buscarRegistros('tbody-calificaciones', 'buscar-calificaciones', 'campo-calificaciones')">Buscar</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Calificación ID</th>
                <th>Alumno ID</th>
                <th>Materia</th>
                <th>Nota</th>
                <th>Periodo</th>
            </tr>
        </thead>
        <tbody id="tbody-calificaciones">
        </tbody>
        <tfoot>
            <tr id="form-calificaciones">
                <td><input type="number" name="calificacion_id" placeholder="ID" required></td>
                <td><input type="number" name="alumno_id" placeholder="Alumno ID" required></td>
                <td><input type="text" name="materia" placeholder="Materia" required></td>
                <td><input type="number" step="0.01" name="nota" placeholder="Nota"></td>
                <td><input type="text" name="periodo" placeholder="Periodo"></td>
            </tr>
            <tr>
                <td colspan="5">
                    <button type="button" onclick="agregarRegistro('calificaciones')">Agregar Calificación</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<script src="script.js"></script>

<script>
    // Filtra las filas de una tabla según el texto ingresado en su buscador.
    // - Si el <select> está en "todos", busca en todas las columnas de la fila.
    // - Si el <select> tiene un índice de columna, busca solo en esa columna.
    // No modifica script.js: se añade aparte para no interferir con agregarRegistro()/cargarTabla().
    function buscarRegistros(tbodyId, inputId, selectId) {
        const tbody = document.getElementById(tbodyId);
        const valor = document.getElementById(inputId).value.trim().toLowerCase();
        const campo = document.getElementById(selectId).value; // 'todos' o índice de columna

        Array.from(tbody.querySelectorAll('tr')).forEach(function (fila) {
            const celdas = fila.querySelectorAll('td');
            let texto;

            if (campo === 'todos') {
                texto = Array.from(celdas).map(td => td.textContent).join(' ').toLowerCase();
            } else {
                const celda = celdas[Number(campo)];
                texto = celda ? celda.textContent.toLowerCase() : '';
            }

            fila.style.display = (valor === '' || texto.includes(valor)) ? '' : 'none';
        });
    }

    // Permite buscar también al presionar Enter en el campo de texto.
    document.querySelectorAll('.search-bar input[type="text"]').forEach(function (input) {
        input.addEventListener('keyup', function (e) {
            if (e.key === 'Enter') {
                const boton = input.closest('.search-bar').querySelector('.btn-search');
                if (boton) boton.click();
            }
        });
    });

    // Si cambian el campo de búsqueda (select), reaplica la búsqueda con el texto actual.
    document.querySelectorAll('.search-bar select').forEach(function (select) {
        select.addEventListener('change', function () {
            const boton = select.closest('.search-bar').querySelector('.btn-search');
            if (boton) boton.click();
        });
    });
</script>

</body>

</html>
