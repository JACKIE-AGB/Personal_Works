<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Tablas Escolares</title>
</head>

<body>

<h1>Panel de Control Escolar</h1>

<h2>Tabla Alumnos</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Alumno ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fecha Nacimiento</th>
                <th>Teléfono</th>
                <th>Email</th>
            </tr>
        </thead>
    </table>
</div>

<h2>Tabla Colegiatura</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Colegiatura ID</th>
                <th>Alumno ID</th>
                <th>Monto</th>
                <th>Mes Pago</th>
                <th>Fecha Pago</th>
                <th>Estado Pago</th>
            </tr>
        </thead>
    </table>
</div>

<h2>Tabla Calificaciones</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Calificación ID</th>
                <th>Alumno ID</th>
                <th>Materia</th>
                <th>Nota</th>
                <th>Periodo</th>
            </tr>
        </thead>
    </table>
</div>

</body>

</html>
