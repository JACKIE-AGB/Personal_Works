<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <title>Tablas Escolares</title>
</head>

<body>

<h1>Panel de Control Escolar</h1>

<h2>Tabla Alumnos</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Alumno ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Fecha Nacimiento</th>
                <th>Teléfono</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tbody-alumnos">
            <!-- Los registros se cargan automáticamente con JS -->
        </tbody>
        <tfoot>
            <tr id="form-alumnos">
                <td><input type="number" name="alumno_id" placeholder="ID" required></td>
                <td><input type="text" name="nombre" placeholder="Nombre" required></td>
                <td><input type="text" name="apellido" placeholder="Apellido" required></td>
                <td><input type="date" name="fecha_nacimiento"></td>
                <td><input type="text" name="telefono" placeholder="Teléfono"></td>
                <td><input type="email" name="email" placeholder="Email"></td>
            </tr>
            <tr>
                <td colspan="6">
                    <button type="button" onclick="agregarRegistro('alumnos')">Agregar Alumno</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<h2>Tabla Colegiatura</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Colegiatura ID</th>
                <th>Alumno ID</th>
                <th>Monto</th>
                <th>Mes Pago</th>
                <th>Fecha Pago</th>
                <th>Estado Pago</th>
            </tr>
        </thead>
        <tbody id="tbody-colegiaturas">
        </tbody>
        <tfoot>
            <tr id="form-colegiaturas">
                <td><input type="number" name="colegiatura_id" placeholder="ID" required></td>
                <td><input type="number" name="alumno_id" placeholder="Alumno ID" required></td>
                <td><input type="number" step="0.01" name="monto" placeholder="Monto" required></td>
                <td><input type="text" name="mes_pagado" placeholder="Mes"></td>
                <td><input type="date" name="fecha_pago"></td>
                <td>
                    <select name="estado_pago">
                        <option value="Pagado">Pagado</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="6">
                    <button type="button" onclick="agregarRegistro('colegiaturas')">Agregar Colegiatura</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<h2>Tabla Calificaciones</h2>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Calificación ID</th>
                <th>Alumno ID</th>
                <th>Materia</th>
                <th>Nota</th>
                <th>Periodo</th>
            </tr>
        </thead>
        <tbody id="tbody-calificaciones">
        </tbody>
        <tfoot>
            <tr id="form-calificaciones">
                <td><input type="number" name="calificacion_id" placeholder="ID" required></td>
                <td><input type="number" name="alumno_id" placeholder="Alumno ID" required></td>
                <td><input type="text" name="materia" placeholder="Materia" required></td>
                <td><input type="number" step="0.01" name="nota" placeholder="Nota"></td>
                <td><input type="text" name="periodo" placeholder="Periodo"></td>
            </tr>
            <tr>
                <td colspan="5">
                    <button type="button" onclick="agregarRegistro('calificaciones')">Agregar Calificación</button>
                </td>
            </tr>
        </tfoot>
    </table>
</div>

<script src="script.js"></script>

</body>

</html>
