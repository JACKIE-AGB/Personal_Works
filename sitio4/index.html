<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Alumnos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <h1>🎓 Sistema de Registro y Consulta de Alumnos</h1>
</header>

<div id="alertBox" class="alert-box"></div>

<main class="container">

    <!-- === Registro de alumnos === -->
    <section class="card">
        <h2>Agregar Alumno</h2>
        <form id="formAlumno" class="grid-form">
            <div class="field">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="field">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="field">
                <label for="fecha_nacimiento">Fecha de nacimiento</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
            </div>
            <div class="field">
                <label for="telefono">Teléfono</label>
                <input type="text" id="telefono" name="telefono" placeholder="10 dígitos">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
            </div>
            <div class="field field-btn">
                <button type="submit" id="btnAgregarAlumno" class="btn btn-primary">➕ Agregar Alumno</button>
            </div>
        </form>
    </section>

    <!-- === Búsqueda y listado === -->
    <section class="card">
        <div class="card-header-row">
            <h2>Alumnos Registrados</h2>
            <div class="search-row">
                <input type="text" id="inputBuscar" placeholder="Buscar por nombre, apellido, email o id...">
                <button id="btnBuscarAlumno" class="btn btn-secondary">🔍 Buscar Alumno</button>
                <button id="btnLimpiarBuscar" class="btn btn-outline">Limpiar</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="tablaAlumnos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Fecha Nac.</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyAlumnos">
                    <tr><td colspan="7" class="loading-row">Cargando alumnos...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- === Detalle de alumno (colegiaturas y calificaciones) === -->
    <section class="card" id="detalleSection" hidden>
        <h2>Detalle del Alumno: <span id="detalleNombre"></span></h2>
        <button id="btnCerrarDetalle" class="btn btn-outline btn-small">✖ Cerrar detalle</button>

        <div class="detalle-grid">
            <!-- Colegiaturas -->
            <div class="detalle-col">
                <h3>Colegiaturas</h3>
                <table>
                    <thead>
                        <tr><th>Mes</th><th>Monto</th><th>Fecha pago</th><th>Estado</th></tr>
                    </thead>
                    <tbody id="tbodyColegiaturas"></tbody>
                </table>

                <form id="formColegiatura" class="mini-form">
                    <input type="text" name="mes_pago" placeholder="Mes (ej. Marzo)" required>
                    <input type="number" name="monto" placeholder="Monto" step="0.01" min="0" required>
                    <input type="date" name="fecha_pago">
                    <select name="estado_pago">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Pagado">Pagado</option>
                        <option value="Atrasado">Atrasado</option>
                    </select>
                    <button type="submit" class="btn btn-primary btn-small">Agregar Colegiatura</button>
                </form>
            </div>

            <!-- Calificaciones -->
            <div class="detalle-col">
                <h3>Calificaciones</h3>
                <table>
                    <thead>
                        <tr><th>Materia</th><th>Nota</th><th>Periodo</th></tr>
                    </thead>
                    <tbody id="tbodyCalificaciones"></tbody>
                </table>

                <form id="formCalificacion" class="mini-form">
                    <input type="text" name="materia" placeholder="Materia" required>
                    <input type="number" name="nota" placeholder="Nota (0-10)" step="0.1" min="0" max="10" required>
                    <input type="text" name="periodo" placeholder="Periodo (ej. 2025-1)" required>
                    <button type="submit" class="btn btn-primary btn-small">Agregar Calificación</button>
                </form>
            </div>
        </div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
